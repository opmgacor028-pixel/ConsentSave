name: Build ConsentSave APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ConsentSave_Android_Project_HP_Build.zip -d extracted
          echo "Mencari Gradle project..."
          find extracted -name settings.gradle.kts -o -name build.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find Gradle project
        id: project
        run: |
          ROOT=$(dirname "$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts -print -quit)")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Gradle root: $ROOT"

      - name: Fix JVM target
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

      - name: Build APK
        working-directory: ${{ steps.project.outputs.root }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConsentSave-APK
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
